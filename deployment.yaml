
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava9
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava9
  template:
    metadata:
      labels:
        app: simplejava9
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava9:latest
          imagePullPolicy: Always
